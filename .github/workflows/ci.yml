name: Joss CI

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🔎 Static Checks, C11 & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Auto-format Go code
        id: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l $(find cmd pkg tools tests -name '*.go' -type f))
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formato detectados:"
            echo "$unformatted"
            gofmt -w $unformatted
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check generated language catalog
        run: go run ./tools/cataloggen --check

      - name: Check generated native documentation
        run: go run ./tools/docgen --check

      - name: Vet
        run: go vet ./...

      - name: C11 native runtime strict build and test
        shell: bash
        run: |
          clang -Wall -Wextra -Werror -O2 \
            -DJOSS_DB_DISABLE_PG -DJOSS_DB_DISABLE_MYSQL -DJOSS_DB_DISABLE_ODBC \
            runtime/native/joss_rt.c runtime/native/joss_web_rt.c \
            runtime/native/joss_concurrency_rt.c runtime/native/joss_db_rt.c \
            runtime/native/joss_crypto_rt.c runtime/native/joss_gui_rt.c \
            runtime/native/joss_rt_test.c \
            -lsqlite3 -lcrypto -pthread -ldl -o "$RUNNER_TEMP/joss_rt_test"
          "$RUNNER_TEMP/joss_rt_test"

      - name: Analyze committed integration project
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/joss" ./cmd/joss
          cd testdata/analyzer-project
          "$RUNNER_TEMP/joss" analyze

      - name: Analyze external JosSecurity project when available
        if: ${{ hashFiles('ejemplos/Joss-Red-JosSecurity/main.joss') != '' }}
        shell: bash
        run: |
          cd ejemplos/Joss-Red-JosSecurity
          "$RUNNER_TEMP/joss" analyze

      - name: Create Pull Request with formatting fixes
        if: steps.gofmt.outputs.has_changes == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="auto-gofmt-fixes"
          git checkout -B "$branch"
          git add -u
          git commit -m "style: auto-format Go code with gofmt"
          git push -f origin "$branch"
          gh pr create --title "style: auto-format Go code with gofmt" \
                       --body "Se detectaron archivos de código Go sin el formato canónico (gofmt). Se aplicó gofmt -w tras verificar que todas las pruebas pasaron exitosamente." \
                       --base "${{ github.ref_name }}" \
                       --head "$branch" || true

      - name: Fail if formatting missing on Pull Request
        if: steps.gofmt.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "::error::Se detectaron archivos sin formato gofmt. Ejecuta 'gofmt -w <archivos>' en tu rama local."
          exit 1

      - name: Publish Quality Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 🔎 Static Checks, C11 & Analyze"
            echo ""
            echo "- **gofmt**: $( [ '${{ steps.gofmt.outputs.has_changes }}' = 'false' ] && echo '✅ Limpio' || echo '⚠️ Archivos formateados' )"
            echo "- **Cataloggen & Docgen**: ✅ Sincronizados"
            echo "- **go vet ./...**: ✅ Sin advertencias"
            echo "- **C11 Native Runtime (\`-Wall -Wextra -Werror\`)**: ✅ 0 warnings + \`joss_rt_test\` PASS"
            echo "- **\`joss analyze\` (testdata/analyzer-project)**: ✅ PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: 🧪 Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux amd64
            os: ubuntu-latest
            run_race: true
          - label: Windows amd64
            os: windows-latest
            run_race: false
          - label: macOS arm64
            os: macos-latest
            run_race: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Architectural Contract Gate
        run: go test -v -count=1 ./tests/architecture

      - name: Full test suite
        run: go test ./...

      - name: Race-sensitive core tests
        if: ${{ matrix.run_race }}
        run: go test -race ./pkg/parser ./pkg/typesystem ./pkg/analyzer ./pkg/core

  build:
    name: 📦 Cross-Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile packages for ${{ matrix.goos }}/${{ matrix.goarch }}
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./...
          mkdir -p "$RUNNER_TEMP/out"
          joss_bin="$RUNNER_TEMP/out/joss-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          runner_bin="$RUNNER_TEMP/out/joss-runner-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -o "$joss_bin" ./cmd/joss
          go build -trimpath -ldflags '-s -w' -o "$runner_bin" ./cmd/runner
          ls -lh "$RUNNER_TEMP/out/"
          {
            echo "### 📦 Cross-Build \`${{ matrix.goos }}/${{ matrix.goarch }}\`"
            echo "- \`joss\`: **$(du -h "$joss_bin" | cut -f1)**"
            echo "- \`joss-runner\`: **$(du -h "$runner_bin" | cut -f1)**"
          } >> "$GITHUB_STEP_SUMMARY"

  vscode:
    name: 🧩 VS Code Language Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-joss/package-lock.json
      - name: Install exact dependencies
        working-directory: vscode-joss
        run: npm ci
      - name: Security audit (critical)
        working-directory: vscode-joss
        run: npm audit --audit-level=critical
      - name: Compile TypeScript
        working-directory: vscode-joss
        run: npm run compile

  summary:
    name: 📊 CI Executive Summary & Gate
    needs: [quality, test, build, vscode]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render CI Dashboard & Enforce Gate
        shell: bash
        env:
          R_QUALITY: ${{ needs.quality.result }}
          R_TEST: ${{ needs.test.result }}
          R_BUILD: ${{ needs.build.result }}
          R_VSCODE: ${{ needs.vscode.result }}
        run: |
          badge() {
            case "$1" in
              success) echo "✅ Passed" ;;
              skipped) echo "⏭️ Skipped" ;;
              cancelled) echo "🚫 Cancelled" ;;
              *) echo "❌ Failed ($1)" ;;
            esac
          }

          {
            echo "## 📊 Joss CI — Executive Summary"
            echo ""
            echo "| Gate | Resultado |"
            echo "| :--- | :---: |"
            echo "| **🔎 Static Checks, C11 & Analyze** | $(badge "$R_QUALITY") |"
            echo "| **🧪 Cross-OS Test Matrix (Linux / Windows / macOS)** | $(badge "$R_TEST") |"
            echo "| **📦 6-Target Cross-Build (CLI + Runner)** | $(badge "$R_BUILD") |"
            echo "| **🧩 VS Code Language Tooling & Audit** | $(badge "$R_VSCODE") |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$R_QUALITY" != "success" ] || [ "$R_TEST" != "success" ] || [ "$R_BUILD" != "success" ] || [ "$R_VSCODE" != "success" ]; then
            echo "::error::Uno o más gates obligatorios de Joss CI fallaron."
            exit 1
          fi
