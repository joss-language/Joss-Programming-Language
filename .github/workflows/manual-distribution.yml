# Manual distribution, verification, and release packaging workflow for Joss
name: Build manual distribution

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publicar o actualizar los archivos generados en GitHub Release"
        required: true
        default: true
        type: boolean
      release_type:
        description: "Tipo de release a publicar (draft, prerelease, published)"
        required: true
        default: draft
        type: choice
        options:
          - draft
          - prerelease
          - published
      release_tag:
        description: "Etiqueta de versión (ej. v3.8.0). Si se omite, se lee de pkg/version/version.go"
        required: false
        type: string
      validation_mode:
        description: "Nivel de validación previa (full: CI completo + race, standard: pre-flight + smoke, fast: mínimo)"
        required: true
        default: standard
        type: choice
        options:
          - standard
          - full
          - fast
      include_vscode:
        description: "🧩 Empaquetar extensión oficial de VS Code (.vsix + jossecurity-vscode.zip)"
        required: true
        default: true
        type: boolean
      run_smoke_tests:
        description: "🧪 Ejecutar smoke tests reales en Linux, Windows y macOS sobre los .zip generados"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # STAGE 1: Pre-flight, Version Resolution & Strict Quality Gate
  # =========================================================================
  preflight:
    name: 🔎 1. Pre-flight & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      commit_subject: ${{ steps.meta.outputs.commit_subject }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Resolve release metadata
        id: meta
        shell: bash
        run: |
          raw_ver=$(grep -oP 'const Version = "\K[^"]+' pkg/version/version.go || echo "0.0.0-dev")
          input_tag="${{ inputs.release_tag }}"
          if [ -n "$input_tag" ]; then
            tag="$input_tag"
          else
            if [[ "$raw_ver" == v* || "$raw_ver" == V* ]]; then
              tag="$raw_ver"
            else
              tag="v${raw_ver}"
            fi
          fi
          short_sha=$(git rev-parse --short=8 HEAD)
          subject=$(git log -1 --pretty=%s)

          echo "version=$raw_ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "commit_subject=$subject" >> "$GITHUB_OUTPUT"

          echo "📌 Release Tag: $tag (source version: $raw_ver, commit: $short_sha)"

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 📐 Verify canonical catalogs & go vet
        run: |
          go run ./tools/cataloggen --check
          go run ./tools/docgen --check
          go vet ./...

      - name: 🏗️ Architectural Contract Gate
        run: go test -v -count=1 ./tests/architecture

      - name: ⚙️ C11 Native Runtime strict build & test (-Wall -Wextra -Werror)
        shell: bash
        run: |
          clang -Wall -Wextra -Werror -O2 \
            -DJOSS_DB_DISABLE_PG -DJOSS_DB_DISABLE_MYSQL -DJOSS_DB_DISABLE_ODBC \
            runtime/native/joss_rt.c runtime/native/joss_web_rt.c \
            runtime/native/joss_concurrency_rt.c runtime/native/joss_db_rt.c \
            runtime/native/joss_crypto_rt.c runtime/native/joss_gui_rt.c \
            runtime/native/joss_rt_test.c \
            -lsqlite3 -lcrypto -pthread -ldl -o "$RUNNER_TEMP/joss_rt_test"
          "$RUNNER_TEMP/joss_rt_test"

      - name: 🔬 Core race-detector suite (full validation mode)
        if: ${{ inputs.validation_mode == 'full' }}
        run: go test -race ./pkg/parser ./pkg/typesystem ./pkg/analyzer ./pkg/core

      - name: 📊 Publish Pre-flight Summary
        shell: bash
        run: |
          {
            echo "### 🔎 Pre-flight & Quality Gate"
            echo ""
            echo "| Campo | Valor |"
            echo "| :--- | :--- |"
            echo "| **Versión / Tag** | \`${{ steps.meta.outputs.tag }}\` (source: \`${{ steps.meta.outputs.version }}\`) |"
            echo "| **Commit** | \`${{ steps.meta.outputs.short_sha }}\` — ${{ steps.meta.outputs.commit_subject }} |"
            echo "| **Modo de validación** | \`${{ inputs.validation_mode }}\` |"
            echo "| **Catálogos y go vet** | ✅ Verificados |"
            echo "| **Architectural Gate** | ✅ Aprobado |"
            echo "| **Runtime Nativo C11** | ✅ 0 warnings (\`-Werror\`) + \`joss_rt_test\` PASS |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # STAGE 2A: Core Multi-Platform Distribution Build (Parallel)
  # =========================================================================
  build-core:
    name: 📦 2a. Build Core Packages (Win/Linux/macOS/Android/SDK)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 50
    outputs:
      build_time_min: ${{ steps.build_dist.outputs.build_time_min }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 🔨 Build multi-platform archives (build_all.ps1)
        id: build_dist
        shell: pwsh
        env:
          VALIDATION_MODE: ${{ inputs.validation_mode }}
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $buildParams = @{
            SkipVSCode = $true
          }
          if ($env:VALIDATION_MODE -ne 'full') {
            $buildParams['SkipTests'] = $true
            Write-Host "⚡ Modo '$env:VALIDATION_MODE': Omitiendo suite redundante de tests Go dentro de build_all.ps1 (validado en Pre-flight + Smoke Tests)" -ForegroundColor Yellow
          }

          ./build_all.ps1 @buildParams
          $sw.Stop()
          $elapsedMin = [math]::Round($sw.Elapsed.TotalMinutes, 2)
          Write-Host "⏱️ Tiempo de empaquetado core: $elapsedMin minutos" -ForegroundColor Cyan
          "build_time_min=$elapsedMin" >> $env:GITHUB_OUTPUT

          # Remove intermediate manifest/checksums (regenerated unified in Stage 4)
          Remove-Item -LiteralPath dist/release-manifest.json -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath dist/SHA256SUMS.txt -ErrorAction SilentlyContinue

      - name: 📊 Core Build Summary
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath dist -File | Sort-Object Name
          $lines = @(
            "### 📦 Core Packages Generados ($($files.Count) archivos en ${{ steps.build_dist.outputs.build_time_min }} min)",
            "",
            "| Paquete | Tamaño |",
            "| :--- | :--- |"
          )
          foreach ($f in $files) {
            $mb = [math]::Round($f.Length / 1MB, 2)
            $lines += "| ``$($f.Name)`` | **$mb MB** |"
          }
          ($lines -join "`n") >> $env:GITHUB_STEP_SUMMARY

      - name: 📤 Upload core distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-core-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 5

  # =========================================================================
  # STAGE 2B: VS Code Extension (.vsix) Build & Audit (Parallel)
  # =========================================================================
  build-vscode:
    name: 🧩 2b. Package VS Code Extension (.vsix)
    needs: preflight
    if: ${{ inputs.include_vscode }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      vscode_version: ${{ steps.pkg.outputs.vscode_version }}
      vsix_name: ${{ steps.pkg.outputs.vsix_name }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-joss/package-lock.json

      - name: 🔍 Install, Audit, Compile & Package VSIX
        id: pkg
        working-directory: vscode-joss
        shell: bash
        run: |
          npm ci
          npm audit --audit-level=critical
          npm run compile

          ext_ver=$(node -p "require('./package.json').version")
          vsix_name="joss-language-${ext_ver}.vsix"
          mkdir -p ../dist-vscode/stage
          npm run package -- --out "../dist-vscode/stage/${vsix_name}"

          # Produce both jossecurity-vscode.zip (legacy bundle) and standalone .vsix
          cp "../dist-vscode/stage/${vsix_name}" "../dist-vscode/${vsix_name}"
          (cd ../dist-vscode/stage && zip -9 -q "../jossecurity-vscode.zip" "${vsix_name}")
          rm -rf ../dist-vscode/stage

          echo "vscode_version=${ext_ver}" >> "$GITHUB_OUTPUT"
          echo "vsix_name=${vsix_name}" >> "$GITHUB_OUTPUT"

          {
            echo "### 🧩 Extensión VS Code Empaquetada"
            echo ""
            echo "- **Versión**: \`v${ext_ver}\`"
            echo "- **VSIX**: \`${vsix_name}\` ($(du -h "../dist-vscode/${vsix_name}" | cut -f1))"
            echo "- **Bundle ZIP**: \`jossecurity-vscode.zip\` ($(du -h "../dist-vscode/jossecurity-vscode.zip" | cut -f1))"
            echo "- **Auditoría npm**: ✅ 0 vulnerabilidades críticas"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload VS Code packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-vscode-package
          path: |
            dist-vscode/*.zip
            dist-vscode/*.vsix
          if-no-files-found: error
          retention-days: 5

  # =========================================================================
  # STAGE 3: Real Cross-OS Smoke Tests on Packaged Archives
  # =========================================================================
  smoke-test:
    name: 🧪 3. Smoke Test (${{ matrix.label }})
    needs: [preflight, build-core]
    if: ${{ inputs.run_smoke_tests }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux amd64
            os: ubuntu-latest
            archive: jossecurity-linux.zip
            binary: joss-linux-amd64
            is_windows: false
          - label: Windows amd64
            os: windows-latest
            archive: jossecurity-windows.zip
            binary: joss.exe
            is_windows: true
          - label: macOS arm64
            os: macos-latest
            archive: jossecurity-macos.zip
            binary: joss-macos-arm64
            is_windows: false
    steps:
      - name: 📥 Checkout testdata
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            testdata/analyzer-project

      - name: 📥 Download packaged core archive
        uses: actions/download-artifact@v4
        with:
          name: dist-core-packages
          pattern: ${{ matrix.archive }}
          path: smoke-dist

      - name: 🧪 Extract & Verify packaged binary (Unix)
        if: ${{ !matrix.is_windows }}
        shell: bash
        run: |
          mkdir -p smoke-bin
          unzip -q "smoke-dist/${{ matrix.archive }}" -d smoke-bin
          BIN="$PWD/smoke-bin/${{ matrix.binary }}"
          chmod +x "$BIN"

          echo "==> 1. joss version"
          VER_OUT=$("$BIN" version)
          echo "$VER_OUT"

          echo "==> 2. joss run (smoke script)"
          cat << 'EOF' > "$RUNNER_TEMP/smoke.joss"
          var $msg = "Joss Smoke OK";
          int $sum = 20 + 22;
          print($msg . ":" . strval($sum));
          EOF
          RUN_OUT=$("$BIN" run "$RUNNER_TEMP/smoke.joss")
          echo "$RUN_OUT"
          echo "$RUN_OUT" | grep -q "Joss Smoke OK:42"

          echo "==> 3. joss analyze (testdata/analyzer-project)"
          (cd testdata/analyzer-project && "$BIN" analyze)

          {
            echo "### 🧪 Smoke Test — ${{ matrix.label }}"
            echo "- **Paquete**: \`${{ matrix.archive }}\`"
            echo "- **Binario**: \`${{ matrix.binary }}\`"
            echo "- **\`joss version\`**: \`$VER_OUT\`"
            echo "- **\`joss run\`**: ✅ \`Joss Smoke OK:42\`"
            echo "- **\`joss analyze\`**: ✅ PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧪 Extract & Verify packaged binary (Windows)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          Expand-Archive -Path "smoke-dist/${{ matrix.archive }}" -DestinationPath "smoke-bin" -Force
          $bin = (Resolve-Path "smoke-bin/${{ matrix.binary }}").Path

          Write-Host "==> 1. joss version"
          $verOut = & $bin version
          if ($LASTEXITCODE -ne 0) { throw "joss version failed" }
          Write-Host $verOut

          Write-Host "==> 2. joss run (smoke script)"
          $smokeFile = Join-Path $env:RUNNER_TEMP "smoke.joss"
          @'
          var $msg = "Joss Smoke OK";
          int $sum = 20 + 22;
          print($msg . ":" . strval($sum));
          '@ | Set-Content -Path $smokeFile -Encoding UTF8
          $runOut = (& $bin run $smokeFile) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "joss run failed" }
          Write-Host $runOut
          if ($runOut -notmatch "Joss Smoke OK:42") { throw "Unexpected smoke output: $runOut" }

          Write-Host "==> 3. joss analyze (testdata/analyzer-project)"
          Push-Location testdata/analyzer-project
          try {
            & $bin analyze
            if ($LASTEXITCODE -ne 0) { throw "joss analyze failed" }
          } finally {
            Pop-Location
          }

          @(
            "### 🧪 Smoke Test — ${{ matrix.label }}",
            "- **Paquete**: ``${{ matrix.archive }}``",
            "- **Binario**: ``${{ matrix.binary }}``",
            "- **``joss version``**: ``$verOut``",
            "- **``joss run``**: ✅ ``Joss Smoke OK:42``",
            "- **``joss analyze``**: ✅ PASS"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 4: Unify Manifest, Verify SHA-256, Publish Release & Dashboard
  # =========================================================================
  publish:
    name: 🚀 4. Verify Checksums & Publish Release
    needs: [preflight, build-core, build-vscode, smoke-test]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.build-core.result == 'success' &&
      (needs.build-vscode.result == 'success' || needs.build-vscode.result == 'skipped') &&
      (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Download core packages
        uses: actions/download-artifact@v4
        with:
          name: dist-core-packages
          path: dist

      - name: 📥 Download VS Code packages
        if: ${{ needs.build-vscode.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: dist-vscode-package
          path: dist

      - name: 🔐 Generate unified manifest & verify SHA-256 checksums
        id: manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VER: ${{ needs.preflight.outputs.version }}
          SHORT_SHA: ${{ needs.preflight.outputs.short_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - << 'PY'
          import hashlib, json, os, datetime

          dist_dir = "dist"
          files = sorted(f for f in os.listdir(dist_dir) if os.path.isfile(os.path.join(dist_dir, f)) and f not in ("release-manifest.json", "SHA256SUMS.txt"))
          artifacts = []
          total_bytes = 0
          for name in files:
              path = os.path.join(dist_dir, name)
              size = os.path.getsize(path)
              total_bytes += size
              h = hashlib.sha256()
              with open(path, "rb") as fp:
                  for chunk in iter(lambda: fp.read(1 << 20), b""):
                      h.update(chunk)
              artifacts.append({
                  "name": name,
                  "bytes": size,
                  "sha256": h.hexdigest(),
              })

          manifest = {
              "schema": 1,
              "product": "Joss",
              "version": os.environ["RELEASE_VER"],
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["SHORT_SHA"],
              "workflow_run": os.environ["RUN_URL"],
              "generated_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "artifacts": artifacts,
          }
          with open(os.path.join(dist_dir, "release-manifest.json"), "w", encoding="utf-8") as fp:
              json.dump(manifest, fp, indent=2)
              fp.write("\n")

          # Generate SHA256SUMS.txt covering all archives + release-manifest.json
          all_files = sorted(f for f in os.listdir(dist_dir) if os.path.isfile(os.path.join(dist_dir, f)) and f != "SHA256SUMS.txt")
          lines = []
          for name in all_files:
              path = os.path.join(dist_dir, name)
              h = hashlib.sha256()
              with open(path, "rb") as fp:
                  for chunk in iter(lambda: fp.read(1 << 20), b""):
                      h.update(chunk)
              lines.append(f"{h.hexdigest()}  {name}")
          with open(os.path.join(dist_dir, "SHA256SUMS.txt"), "w", encoding="utf-8") as fp:
              fp.write("\n".join(lines) + "\n")

          print(f"Generated release-manifest.json & SHA256SUMS.txt ({len(all_files)} files, {total_bytes / (1024*1024):.2f} MB)")
          PY

          echo "==> Cryptographic verification (sha256sum -c)"
          (cd dist && sha256sum -c SHA256SUMS.txt)

          total_count=$(find dist -maxdepth 1 -type f | wc -l)
          total_mb=$(du -sm dist | awk '{print $1}')
          echo "artifact_count=$total_count" >> "$GITHUB_OUTPUT"
          echo "total_mb=$total_mb" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload unified distribution bundle
        uses: actions/upload-artifact@v4
        with:
          name: joss-distribution-${{ needs.preflight.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publish or update GitHub Release
        id: release
        if: ${{ inputs.create_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SHORT_SHA: ${{ needs.preflight.outputs.short_sha }}
        run: |
          mapfile -t FILES < <(find dist -maxdepth 1 -type f | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No se encontraron artefactos en dist/"
            exit 1
          fi

          cat << EOF > "$RUNNER_TEMP/release_header.md"
          ## 🚀 Joss ${RELEASE_TAG}

          Distribución oficial multiplataforma compilada, verificada con smoke tests reales (Linux, Windows, macOS) y firmada con checksums SHA-256.

          ### ⚡ Instalación rápida
          - **Windows (PowerShell):** descarga \`jossecurity-windows.zip\` o ejecuta \`install/remote-install.ps1\`
          - **Linux / macOS:** descarga \`jossecurity-linux.zip\` / \`jossecurity-macos.zip\` o ejecuta \`install/remote-install.sh\`
          - **Android (Termux):** descarga \`jossecurity-android.zip\`
          - **VS Code:** instala el archivo \`.vsix\` incluido (o \`jossecurity-vscode.zip\`)

          ### 🔐 Verificación de integridad
          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ---
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "🔄 Actualizando release existente '$RELEASE_TAG'..."
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --repo "$GH_REPO" --clobber
            edit_args=(release edit "$RELEASE_TAG" --repo "$GH_REPO")
            if [ "$RELEASE_TYPE" = "draft" ]; then
              edit_args+=(--draft=true --prerelease=false)
            elif [ "$RELEASE_TYPE" = "prerelease" ]; then
              edit_args+=(--draft=false --prerelease=true)
            else
              edit_args+=(--draft=false --prerelease=false)
            fi
            gh "${edit_args[@]}"
          else
            echo "🎉 Creando nueva release '$RELEASE_TAG' ($RELEASE_TYPE)..."
            create_args=(release create "$RELEASE_TAG" --repo "$GH_REPO" --title "Joss $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release_header.md" --generate-notes)
            if [ "$RELEASE_TYPE" = "draft" ]; then
              create_args+=(--draft)
            elif [ "$RELEASE_TYPE" = "prerelease" ]; then
              create_args+=(--prerelease)
            fi
            create_args+=("${FILES[@]}")
            gh "${create_args[@]}"
          fi

          rel_url=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq .url)
          echo "release_url=$rel_url" >> "$GITHUB_OUTPUT"
          echo "✨ Release lista: $rel_url"

      - name: 📊 Executive Release Dashboard
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
          BUILD_TIME: ${{ needs.build-core.outputs.build_time_min }}
          VSCODE_STATUS: ${{ needs.build-vscode.result }}
          SMOKE_STATUS: ${{ needs.smoke-test.result }}
        run: |
          {
            echo "## 🚀 Joss Distribution Dashboard — \`${RELEASE_TAG}\`"
            echo ""
            echo "| Etapa | Estado | Detalle |"
            echo "| :--- | :---: | :--- |"
            echo "| **1. Pre-flight & Quality Gate** | ✅ | Cataloggen, Docgen, \`go vet\`, C11 \`-Werror\`, Architecture Gate |"
            echo "| **2a. Core Multi-Platform Build** | ✅ | Windows, Linux, macOS, Android, Mobile SDK (${BUILD_TIME} min) |"
            if [ "$VSCODE_STATUS" = "success" ]; then
              echo "| **2b. VS Code Extension (.vsix)** | ✅ | Empaquetado y auditado (\`npm audit\`) |"
            else
              echo "| **2b. VS Code Extension (.vsix)** | ⏭️ | Omitido por configuración |"
            fi
            if [ "$SMOKE_STATUS" = "success" ]; then
              echo "| **3. Cross-OS Smoke Tests** | ✅ | Linux amd64, Windows amd64, macOS arm64 verificados |"
            else
              echo "| **3. Cross-OS Smoke Tests** | ⏭️ | Omitido por configuración |"
            fi
            echo "| **4. Checksums & Release** | ✅ | \`sha256sum -c\` verificado · Tipo: \`${RELEASE_TYPE}\` · Modo: \`${VALIDATION_MODE}\` |"
            echo ""
            if [ -n "$RELEASE_URL" ]; then
              echo "🔗 **GitHub Release:** ${RELEASE_URL}"
              echo ""
            fi
            echo "### 📦 Artefactos Publicados y Checksums SHA-256"
            echo ""
            echo "| Archivo | Tamaño | SHA-256 |"
            echo "| :--- | ---: | :--- |"
            while read -r hash fname; do
              size_h=$(du -h "dist/$fname" | cut -f1)
              echo "| \`$fname\` | **$size_h** | \`${hash:0:16}...\` |"
            done < dist/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
